app-id: org.moonfin.moonfin
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

command: moonfin

finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --socket=session-bus
  - --system-talk-name=org.freedesktop.NetworkManager
  - --filesystem=home

modules:
  - name: appstream-compose-shim
    # Shim for SDKs that dropped appstream-compose (24.08+); appstreamcli compose replaces it.
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin
      - cp appstream-compose /app/bin/appstream-compose
      - chmod +x /app/bin/appstream-compose
    sources:
      - type: script
        dest-filename: appstream-compose
        commands:
          - |
            #!/usr/bin/env bash
            args=()
            basename_val=""
            skip_next=0
            for arg in "$@"; do
              if [[ "$skip_next" -eq 1 ]]; then
                basename_val="$arg"
                skip_next=0
                continue
              fi
              if [[ "$arg" == --basename ]]; then
                skip_next=1
                continue
              fi
              if [[ "$arg" == --basename=* ]]; then
                basename_val="${arg#--basename=}"
                continue
              fi
              if [[ -n "$basename_val" && "$arg" == "$basename_val" ]]; then
                args+=("/")
                continue
              fi
              args+=("$arg")
            done
            exec appstreamcli compose "${args[@]}"
  - name: moonfin
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/moonfin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/512x512/apps
      - cp -r . /app/moonfin/
      - chmod +x /app/moonfin/moonfin
      - |
        cat > /app/bin/moonfin << 'EOFRUN'
        #!/bin/sh
        export LD_LIBRARY_PATH="/app/moonfin/lib/moonfin:/app/moonfin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

        resolve_exact_lib() {
          lib_name="$1"
          old_ifs="$IFS"
          IFS=':'
          for lib_dir in $LD_LIBRARY_PATH; do
            [ -n "$lib_dir" ] && [ -e "$lib_dir/$lib_name" ] && IFS="$old_ifs" && return 0
          done
          IFS="$old_ifs"

          for lib_dir in /lib /lib64 /usr/lib /usr/lib64 /usr/lib/x86_64-linux-gnu /usr/lib/aarch64-linux-gnu; do
            [ -e "$lib_dir/$lib_name" ] && return 0
          done

          return 1
        }

        missing_libs="$(ldd /app/moonfin/moonfin 2>/dev/null | awk '/not found/ {print $1}' | sort -u || true)"
        if ! resolve_exact_lib libsqlite3.so; then
          missing_libs="$(printf '%s\n%s\n' "$missing_libs" "libsqlite3.so" | awk 'NF' | sort -u)"
        fi

        if [ -n "$missing_libs" ]; then
          echo "Moonfin cannot start. Missing shared libraries:" >&2
          printf '  - %s\n' $missing_libs >&2
          echo "Install the missing libraries in the runtime and retry." >&2
          exit 127
        fi

        exec /app/moonfin/moonfin "$@"
        EOFRUN
      - chmod +x /app/bin/moonfin
      - echo $PWD
      - '[ -f org.moonfin.moonfin.png ] && cp org.moonfin.moonfin.png /app/share/icons/hicolor/512x512/apps/ || true'
      - cp org.moonfin.moonfin.desktop /app/share/applications/
      - cp org.moonfin.moonfin.metainfo.xml /app/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/Moonfin-Client/Moonfin-Core/releases/download/2.6.0/Moonfin_Linux_v2.6.0.tar.gz
        sha256: 33344d6f285fcd97a3e1e2e295f03bae8396c7a488a1a241aa78750ef2c59c1b
        dest: .
        only-arches:
          - x86_64
        x-checker-data:
          type: git
          tag-pattern: '^([0-9.]+)$'
      - type: archive
        url: https://github.com/Moonfin-Client/Moonfin-Core/releases/download/2.6.0/Moonfin_LinuxARM64_v2.6.0.tar.gz
        sha256: f2cf8db9a04bd9abea76d5441f5de973cbab2d0ac980f58140ad2e0471c567d0
        dest: .
        only-arches:
          - aarch64
        x-checker-data:
          type: git
          tag-pattern: '^([0-9.]+)$'
      - type: file
        path: org.moonfin.moonfin.desktop
      - type: file
        path: org.moonfin.moonfin.metainfo.xml
      - type: file
        path: org.moonfin.moonfin.png

